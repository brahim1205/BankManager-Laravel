services:
  - type: web
    name: bankmanager-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    buildCommand: docker build -t bankmanager-api .
    startCommand: docker/render-start.sh
    healthCheckPath: /api/v1/status
    healthCheckTimeout: 300
    envVars:
      - key: APP_NAME
        value: BankManager
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: DB_CONNECTION
        value: pgsql
      - key: L5_SWAGGER_USE_ABSOLUTE_PATH
        value: true
      - key: MAIL_MAILER
        value: log
      - key: QUEUE_CONNECTION
        value: database
      - key: APP_URL
        fromService:
          type: web
          name: bankmanager-api
          property: host
      - key: L5_SWAGGER_BASE_PATH
        fromService:
          type: web
          name: bankmanager-api
          property: host

databases:
  - name: bankmanager-db
    databaseName: bankmanager
    user: bankmanager_user
    plan: starter
